# src/engine/tickers.yaml
# 15 S&P 100 tickers used by the NLP engine.
#
# Fields per entry:
#   ticker   : canonical ticker symbol
#   name     : official company name
#   sector   : GICS sector
#   aliases  : list of strings the entity linker will accept (case-insensitive)
#   ambiguous: if true, the linker requires a financial context word nearby
#              before mapping a bare alias to this ticker (avoids false positives
#              e.g. "apple" in food context vs. AAPL in finance context)

tickers:

  - ticker: JPM
    name: JPMorgan Chase & Co.
    sector: Financials
    aliases:
      - JPMorgan
      - JP Morgan
      - JPMorgan Chase
      - Chase
    ambiguous: false

  - ticker: BAC
    name: Bank of America Corp.
    sector: Financials
    aliases:
      - Bank of America
      - BofA
      - BoA
    ambiguous: false

  - ticker: C
    name: Citigroup Inc.
    sector: Financials
    aliases:
      - Citi
      - Citigroup
      - Citibank
      - Citi Group
    ambiguous: false

  - ticker: GS
    name: The Goldman Sachs Group Inc.
    sector: Financials
    aliases:
      - Goldman Sachs
      - Goldman
      - GS Group
    ambiguous: false

  - ticker: WFC
    name: Wells Fargo & Co.
    sector: Financials
    aliases:
      - Wells Fargo
      - WellsFargo
    ambiguous: false

  - ticker: AAPL
    name: Apple Inc.
    sector: Information Technology
    aliases:
      - Apple
      - Apple Inc
    ambiguous: true   # "apple" can appear in non-financial contexts

  - ticker: MSFT
    name: Microsoft Corp.
    sector: Information Technology
    aliases:
      - Microsoft
      - MSFT Corp
    ambiguous: false

  - ticker: AMZN
    name: Amazon.com Inc.
    sector: Consumer Discretionary
    aliases:
      - Amazon
      - Amazon.com
      - AWS
    ambiguous: false

  - ticker: GOOGL
    name: Alphabet Inc.
    sector: Communication Services
    aliases:
      - Alphabet
      - Google
      - Alphabet Inc
    ambiguous: false

  - ticker: META
    name: Meta Platforms Inc.
    sector: Communication Services
    aliases:
      - Meta
      - Facebook
      - Meta Platforms
      - Instagram      # Instagram owned by Meta; context-check required
    ambiguous: true   # "meta" can mean metadata outside finance

  - ticker: NVDA
    name: NVIDIA Corp.
    sector: Information Technology
    aliases:
      - NVIDIA
      - Nvidia
    ambiguous: false

  - ticker: XOM
    name: Exxon Mobil Corp.
    sector: Energy
    aliases:
      - ExxonMobil
      - Exxon
      - Mobil
    ambiguous: false

  - ticker: JNJ
    name: Johnson & Johnson
    sector: Health Care
    aliases:
      - Johnson & Johnson
      - J&J
      - JnJ
    ambiguous: false

  - ticker: BRK-B
    name: Berkshire Hathaway Inc. Class B
    sector: Financials
    aliases:
      - Berkshire Hathaway
      - Berkshire
      - BRK
      - Buffett        # context check: verify financial context
    ambiguous: true

  - ticker: V
    name: Visa Inc.
    sector: Information Technology
    aliases:
      - Visa
      - Visa Inc
    ambiguous: false
